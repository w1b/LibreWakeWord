<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">How LibreWakeWord loads and arms a DSP keyphrase model</title>
  <desc id="desc">Sequence diagram showing model import, the Shizuku shell bootstrap, privileged self-instrumentation, Android keyphrase enrollment, AlwaysOnHotwordDetector recognition start, and the resulting model load and recognition start in the vendor SoundTrigger HAL and DSP.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" class="marker-green"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" class="marker-blue"/>
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" class="marker-amber"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .lane-title { font-size: 15px; font-weight: 700; fill: #1f2328; }
      .lane-sub { font-size: 12px; fill: #59636e; }
      .label { font-size: 14px; fill: #1f2328; }
      .subtext { font-size: 10px; fill: #59636e; }
      .code { font-size: 12px; fill: #1f2328; }
      .lane { stroke: #afb8c1; stroke-width: 1.2; stroke-dasharray: 4 7; }
      .actor-green, .prep { fill: #f0fff4; stroke: #1a7f37; }
      .actor-blue { fill: #f1f8ff; stroke: #0969da; }
      .actor-amber { fill: #fff8c5; stroke: #9a6700; }
      .artifact { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
      .artifact-fold { fill: none; stroke: #57606a; stroke-width: 1.2; }
      .marker-green, .marker-blue, .marker-amber { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .marker-green { stroke: #1a7f37; }
      .marker-blue { stroke: #0969da; }
      .marker-amber { stroke: #9a6700; }
      .arrow-green { stroke: #1a7f37; stroke-width: 1.8; fill: none; marker-end: url(#arrow-green); }
      .arrow-blue { stroke: #0969da; stroke-width: 1.8; fill: none; marker-end: url(#arrow-blue); }
      .arrow-amber { stroke: #9a6700; stroke-width: 1.8; fill: none; marker-end: url(#arrow-amber); }
      @media (prefers-color-scheme: dark) {
        .lane-title, .label, .code { fill: #e6edf3; }
        .lane-sub, .subtext { fill: #8b949e; }
        .lane { stroke: #30363d; }
        .actor-green, .prep { fill: #0d1514; stroke: #326d49; }
        .actor-blue { fill: #0c1418; stroke: #30697f; }
        .actor-amber { fill: #17140d; stroke: #80662e; }
        .artifact { fill: #0c1114; stroke: #61727a; }
        .artifact-fold { stroke: #61727a; }
        .marker-green, .arrow-green { stroke: #66e394; }
        .marker-blue, .arrow-blue { stroke: #62c8f5; }
        .marker-amber, .arrow-amber { stroke: #efbd62; }
      }
    </style>
  </defs>

  <g transform="translate(0 -45)">
  <!-- actors -->
  <g class="mono">
    <rect x="36" y="78" width="240" height="58" rx="8" class="actor-green"/>
    <text x="156" y="103" class="lane-title" text-anchor="middle">LibreWakeWord</text>
    <text x="156" y="122" class="lane-sub" text-anchor="middle">app storage + voice service</text>

    <rect x="316" y="78" width="220" height="58" rx="8" class="actor-green"/>
    <text x="426" y="103" class="lane-title" text-anchor="middle">Shizuku UserService</text>
    <text x="426" y="122" class="lane-sub" text-anchor="middle">shell process</text>

    <rect x="576" y="78" width="240" height="58" rx="8" class="actor-green"/>
    <text x="696" y="103" class="lane-title" text-anchor="middle">HotwordInstrumentation</text>
    <text x="696" y="122" class="lane-sub" text-anchor="middle">self-targeted app process</text>

    <rect x="856" y="78" width="250" height="58" rx="8" class="actor-blue"/>
    <text x="981" y="103" class="lane-title" text-anchor="middle">Android system_server</text>
    <text x="981" y="122" class="lane-sub" text-anchor="middle">VoiceInteraction + SoundTrigger</text>

    <rect x="1146" y="78" width="218" height="58" rx="8" class="actor-amber"/>
    <text x="1255" y="103" class="lane-title" text-anchor="middle">Vendor HAL / DSP</text>
    <text x="1255" y="122" class="lane-sub" text-anchor="middle">the hardware</text>
  </g>

  <!-- lifelines -->
  <path d="M156 136V574M426 136V574M696 136V574M981 136V574M1255 136V574" class="lane"/>

  <!-- 1. import -->
  <path d="M48 155H70L82 167V203H48Z" class="artifact"/>
  <path d="M70 155V167H82" class="artifact-fold"/>
  <text x="94" y="167" class="mono label">model bytes</text>
  <text x="94" y="186" class="mono subtext">phrase · locale · keyphrase ID</text>
  <text x="94" y="203" class="mono subtext">vendor UUID · model version</text>

  <!-- 2. ask shell service to arm -->
  <path d="M156 245H418" class="arrow-green"/>
  <text x="287" y="236" class="mono label" text-anchor="middle">bindUserService(daemon=true)</text>

  <!-- 3. select active VIS -->
  <path d="M426 273H973" class="arrow-green"/>
  <text x="700" y="264" class="mono label" text-anchor="middle">set active voice-interaction service</text>

  <!-- 4. launch instrumentation -->
  <path d="M426 315H688" class="arrow-green"/>
  <text x="557" y="306" class="mono label" text-anchor="middle">am instrument --no-hidden-api-checks -w</text>

  <!-- 5. privileged preparation -->
  <rect x="551" y="337" width="290" height="54" rx="7" class="prep"/>
  <text x="566" y="358" class="mono code">adoptShellPermissionIdentity(…)</text>
  <text x="566" y="379" class="mono code">KeyphraseSoundModel(bytes, metadata)</text>

  <!-- 6. enroll -->
  <path d="M696 433H973" class="arrow-blue"/>
  <text x="835" y="424" class="mono label" text-anchor="middle">updateKeyphraseSoundModel(model)</text>

  <!-- 7. detector creation -->
  <path d="M156 475H973" class="arrow-blue"/>
  <text x="565" y="466" class="mono label" text-anchor="middle">createAlwaysOnHotwordDetector(phrase, locale)</text>

  <!-- 8. start request causes load + arm -->
  <path d="M156 515H973" class="arrow-blue"/>
  <text x="565" y="506" class="mono label" text-anchor="middle">startRecognition(CAPTURE_TRIGGER_AUDIO)</text>
  <path d="M981 550H1247" class="arrow-amber"/>
  <text x="1114" y="541" class="mono label" text-anchor="middle">load keyphrase sound model</text>
  <path d="M981 585H1247" class="arrow-amber"/>
  <text x="1114" y="576" class="mono label" text-anchor="middle">startRecognition(handle, config)</text>

  </g>
</svg>
